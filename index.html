<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suggest Dhamma Topics · IBC Singapore</title>
<meta name="description" content="Suggest Dhamma topics for the speakers at the Indonesian Buddhist Community Singapore Indonesian Service.">
<meta name="theme-color" content="#fcfbf7">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="app-head">
    <svg class="lotus" viewBox="0 0 120 90" aria-hidden="true">
      <ellipse cx="62" cy="80" rx="46" ry="9" fill="#279745" opacity=".18"/>
      <path d="M60 78 C44 62 44 38 60 18 C76 38 76 62 60 78Z" fill="#e9a6c4" opacity=".75"/>
      <path d="M60 78 C38 72 26 54 28 36 C46 42 58 58 60 78Z" fill="#f0bfd5" opacity=".8"/>
      <path d="M60 78 C82 72 94 54 92 36 C74 42 62 58 60 78Z" fill="#f0bfd5" opacity=".8"/>
      <path d="M60 78 C50 70 52 52 60 40 C68 52 70 70 60 78Z" fill="#fbe3ee"/>
    </svg>
    <div class="row">
      <img class="logo" src="assets/logo.png" alt="Indonesian Buddhist Community Singapore logo" width="52" height="52">
      <div class="org">Indonesian Buddhist Community<br>Singapore</div>
    </div>
    <h1>Suggest Dhamma topics</h1>
    <p>What would you like our speakers to share at the Indonesian Service?</p>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="section-label"><span>Upcoming speakers</span><span id="counter"></span></div>

  <div class="carousel" id="carousel">
    <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
    <button class="nav prev" id="prev" type="button" aria-label="Previous speaker">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav next" id="next" type="button" aria-label="Next speaker">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="speaker-meta" aria-live="polite"><h2 id="spName">Loading speakers…</h2></div>
  </div>

  <form id="form" novalidate>
    <div>
      <label for="topic">Topic(s) for <span id="forName">the speaker</span></label>
      <textarea id="topic" placeholder="e.g.&#10;1. Staying mindful when work gets stressful&#10;2. Explaining karma to our children"></textarea>
    </div>
    <div>
      <label for="who">Name <small>(optional)</small></label>
      <input type="text" id="who" placeholder="Leave blank to stay anonymous" autocomplete="name">
    </div>
    <button class="submit" id="submit" type="submit" disabled>Submit suggestion</button>
    <p class="error" id="error" role="alert" hidden></p>
  </form>

  <div class="success" id="success" hidden>
    <div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3 id="thanks">Thank you!</h3>
    <p id="successMsg">Your suggestion has been sent.</p>
    <div class="actions">
      <button class="submit" id="nextSpeaker" type="button">Suggest for the next speaker →</button>
    </div>
  </div>

  <footer class="foot">Suggestions go to the IBC service committee.</footer>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
